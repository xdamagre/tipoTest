<style>

*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-weight:600;font-size:17px;line-height:1.4}
.top{padding:14px 16px;display:flex;justify-content:space-around;align-items:center;font-weight:800;font-size:22px;border-bottom:2px solid var(--line)}
.bar{flex:1;height:16px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .4s}
main{max-width:720px;margin:0 auto;padding:8px 16px 190px}
h2{font-size:24px;font-weight:800;margin:8px 0 14px}
h3{font-size:20px;font-weight:800;margin:26px 0 12px}
#phrase{font-weight:400;border:2px solid var(--line);border-bottom-width:4px;border-radius:20px;padding:26px 18px;min-height:130px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(26px,6vw,42px);line-height:1.2;overflow-wrap:anywhere;margin-bottom:22px;transition:opacity .2s;color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:inherit;font-weight:800;color:var(--ink);background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:16px 10px;cursor:pointer}
@media (hover:hover){.opt:hover:not(:disabled){background:var(--selbg)}}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.opt.sel{background:var(--selbg);border-color:var(--blue);color:var(--seltx)}
.opt.ok{background:var(--okbg);border-color:var(--green);color:var(--oktx)}
.opt.ko{background:var(--kobg);border-color:var(--red);color:var(--kotx)}
.opt:disabled{cursor:default}
.opt:focus-visible,.go:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#subBox[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){#subBox.pop{animation:pop .3s ease-out}@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}}

footer.ok{background:var(--okbg);border-color:transparent}
footer.ko{background:var(--kobg);border-color:transparent}
.fin{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
#msg{font-weight:800;font-size:19px;flex:1;min-width:200px}
#msg small{display:block;font-weight:600;font-size:15px}
footer.ok #msg{color:var(--oktx)}footer.ko #msg{color:var(--kotx)}
.go{font:inherit;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--green);border:0;border-bottom:4px solid var(--green-d);border-radius:16px;padding:14px 34px;cursor:pointer;min-width:170px}
.go:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.go:disabled{background:var(--track);border-bottom-color:var(--line);color:var(--mute);cursor:not-allowed}
footer.ko .go{background:var(--red);border-bottom-color:var(--red-d)}
@media (max-width:520px){.go{width:100%}}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) scale(.8);padding:12px 24px;border-radius:99px;font-weight:800;font-size:19px;opacity:0;pointer-events:none;z-index:20;transition:opacity .25s,transform .25s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#toast.fire{background:#ff9600;color:#fff}#toast.gold{background:#ffc800;color:#4b3b00}#toast.sad{background:#4b4b4b;color:#fff}
.st{display:inline-block}
.st.t1{color:#ff9600}.st.t2{color:#ff4b4b}.st.t3{color:#ffc800;text-shadow:0 0 10px #ff9600}
@media (prefers-reduced-motion:no-preference){
.st.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.5)}}
.st.burn{animation:burn 1.2s forwards;color:var(--mute)}
@keyframes burn{0%{transform:none}15%{transform:translateX(-5px) rotate(-10deg)}30%{transform:translateX(5px) rotate(10deg)}45%{transform:translateX(-5px) rotate(-10deg)}100%{transform:translateY(8px) scale(.8);opacity:.5}}

@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#subBox{scroll-margin-bottom:170px}
@media (max-width:520px){
body{font-size:16px}
h2{font-size:21px;margin:4px 0 12px}
main{padding:6px 12px 200px}
#phrase{min-height:100px;padding:20px 12px;margin-bottom:16px}
.opts{gap:10px}
.opt{padding:15px 6px;font-size:16px}
.top{font-size:19px;padding:10px 8px}
#msg{font-size:17px;min-width:0}
footer{padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
}

<script>

'serif|modern':'Abril Fatface,Libre Bodoni,Gloock,Rozha One,Prata',
'serif|slab':'Roboto Slab,Arvo,Bitter,Crete Round,Aleo,Josefin Slab',
'sans|grot':'Bebas Neue,Fjalla One,Libre Franklin,Archivo Black,Barlow Condensed,Antonio',
'sans|neo':'Roboto,Public Sans,Work Sans,IBM Plex Sans,Albert Sans',

'script|formal':'Italianno,Tangerine,Alex Brush,Petit Formal Script,Playball',

'script|black':'UnifrakturMaguntia,Grenze Gotisch,New Rocker,Jacquard 24',

[['sans','grot','ITC Franklin Gothic'],['serif','slab','American Typewriter'],['serif','slab','Archer'],['serif','slab','Rockwell'],['serif','modern','Didot'],['sans','geo','Avenir'],['sans','human','Frutiger'],['sans','human','Gill Sans'],['sans','geo','Futura'],['sans','neo','Helvetica']].forEach(a=>FONTS.push([a[0],a[1],a[2],a[0]==='serif'?'serif':'sans-serif']));

];

const YR={'EB Garamond':'c. 1530','Cormorant Garamond':'2015','Crimson Text':'2010','Sorts Mill Goudy':'1915','IM Fell English':'c. 1670','Goudy Bookletter 1911':'1911','Linden Hill':'1927','Baskervville':'1757','Libre Baskerville':'1757','Libre Caslon Text':'1722','PT Serif':'2010','Source Serif 4':'2014','Playfair Display':'2011','Bodoni Moda':'c. 1790','Libre Bodoni':'c. 1790','Abril Fatface':'2011','Rokkitt':'2011','Zilla Slab':'2017','Roboto Slab':'2013','Arvo':'2010','Bitter':'2011','Oswald':'2011','Anton':'2011','Bebas Neue':'2010','Libre Franklin':'1902','Barlow Condensed':'2017','Inter':'2016','Roboto':'2011','Work Sans':'2015','IBM Plex Sans':'2017','Cabin':'2010','Lato':'2010','Open Sans':'2011','Fira Sans':'2013','Ubuntu':'2010','Source Sans 3':'2012','Poppins':'2014','Montserrat':'2011','Raleway':'2010','Quicksand':'2008','Josefin Sans':'2010','Outfit':'2021','Dancing Script':'2010','Caveat':'2015','Pacifico':'2011','Lobster':'2010','Press Start 2P':'2012'};
Object.assign(YR,{'ITC Franklin Gothic':'1902','American Typewriter':'1974','Archer':'2001','Rockwell':'1934','Didot':'c. 1784','Avenir':'1988','Frutiger':'1976','Gill Sans':'1928','Futura':'1927','Helvetica':'1957'});
const yr=()=>YR[cur[2]]?' · '+YR[cur[2]]:'';
const $=id=>document.getElementById(id);
const famOpts=$('famOpts'),subOpts=$('subOpts'),subBox=$('subBox'),go=$('go'),foot=$('foot'),msg=$('msg'),phrase=$('phrase');
let cur,last=-1,lastP=-1,done=false,fSel='',sSel='',xp=0,streak=0,n=0;
const rnd=(len,not)=>{let i;do{i=Math.floor(Math.random()*len)}while(i===not&&len>1);return i};
function mk(box,items,pick){
  box.innerHTML='';
  items.forEach(([v,t])=>{const b=document.createElement('button');b.className='opt';b.dataset.v=v;b.textContent=t;b.onclick=()=>{if(!done)pick(v)};box.appendChild(b)});

function refresh(){
  famOpts.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',b.dataset.v===fSel));

let best=0,rec=false,tt=0,parts=[],raf=0;
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
try{best=+localStorage.getItem('tipo_best')||0;xp=+localStorage.getItem('tipo_xp')||0}catch(e){}
$('sBest').textContent=best;$('sXp').textContent=xp;
const cv=$('cv'),cx=cv.getContext('2d');
function fit(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener('resize',fit);fit();
function confetti(power){
  if(calm)return;
  const cols=['#58cc02','#1cb0f6','#ffc800','#ff4b4b','#ce82ff','#ff9600'],N=Math.min(40+power*20,240);
  for(let i=0;i<N;i++){const a=-Math.PI/2+(Math.random()-.5)*1.7,v=8+Math.random()*(8+power);
    parts.push({x:innerWidth/2,y:innerHeight*.7,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*6,s:6+Math.random()*6,c:cols[i%6],l:1})}
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.l>0&&p.y<innerHeight+30);
  parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=.2;p.l-=.007;cx.save();cx.globalAlpha=Math.max(p.l,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  raf=parts.length?requestAnimationFrame(tick):0;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}
function toast(t,k){const e=$('toast');e.textContent=t;e.className='show '+k;clearTimeout(tt);tt=setTimeout(()=>e.className='',2200)}
const MS={3:'Ratxa de 3! Ja escalfes',5:'Ratxa de 5! Imparable',10:'Ratxa de 10! Ull de falcó',15:'Ratxa de 15! Llegenda',20:'Ratxa de 20! Ets una font humana'};
function after(perfect,prev){
  const fl=$('flame'),t=streak>=10?3:streak>=5?2:streak>=3?1:0;
  fl.className='st t'+t;$('fe').textContent=['🔥','🔥','🔥🔥','🔥🔥🔥'][t];
  try{localStorage.setItem('tipo_xp',xp)}catch(e){}
  if(perfect){
    fl.classList.remove('bump');void fl.offsetWidth;fl.classList.add('bump');
    const old=best;
    if(streak>best){best=streak;$('sBest').textContent=best;try{localStorage.setItem('tipo_best',best)}catch(e){}}
    if(streak>old&&old>=3&&!rec){rec=true;toast(`Nou rècord: ${streak}! 🏆`,'gold');confetti(16)}
    else if(streak===3||streak%5===0){toast(MS[streak]||`Ratxa de ${streak}!`,'fire');confetti(8+streak)}
    else confetti(Math.min(streak,6));
  }else{
    rec=false;
    if(prev>=2){
      $('fe').textContent='💨';fl.classList.add('burn');foot.classList.add('shake');
      toast(`Ratxa de ${prev} perduda 💔`,'sad');
      setTimeout(()=>{fl.classList.remove('burn');$('fe').textContent='🔥';foot.classList.remove('shake')},1300);
    }
  }
}
let mode='slides';
try{mode=localStorage.getItem('tipo_mode')||'slides'}catch(e){}
const modeB=$('mode');
function setMode(m,user){
  mode=m;modeB.setAttribute('aria-checked',m==='slides');
  $('modeT').textContent=m==='slides'?'Diapos':'Totes';
  try{localStorage.setItem('tipo_mode',m)}catch(e){}
  if(user){toast(m==='slides'?'Només les tipografies de les diapositives':'Totes les tipografies','fire');if(!done)newQ()}
}
modeB.onclick=()=>setMode(mode==='slides'?'all':'slides',true);
setMode(mode,false);
go.onclick=()=>done?newQ():verify();
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!go.disabled&&document.activeElement!==go){e.preventDefault();go.click()}});
newQ();
</script>
</body>
</html>
